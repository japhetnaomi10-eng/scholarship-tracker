<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scholarship Tracker for Undergrads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f6f8;--surface:#fff;--ink:#14212b;--muted:#56677a;--line:#d5dee5;--accent:#0b6e8a;--accent-ink:#fff;--soft:#e1f0f5;--warn:#b4530b;--ok:#17803d;--bad:#b42318;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e161d;--surface:#16212a;--ink:#e8eef2;--muted:#9bacbb;--line:#2a3a47;--accent:#4fb7d3;--accent-ink:#06222c;--soft:#173340;--warn:#f0a259;--ok:#5fd08a;--bad:#ff8a7d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e161d;--surface:#16212a;--ink:#e8eef2;--muted:#9bacbb;--line:#2a3a47;--accent:#4fb7d3;--accent-ink:#06222c;--soft:#173340;--warn:#f0a259;--ok:#5fd08a;--bad:#ff8a7d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 56px}
h1{font:800 clamp(1.7rem,6vw,2.4rem)/1.1 "Bricolage Grotesque",system-ui,sans-serif;margin:8px 0 8px;letter-spacing:-.02em}
h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0}
.lede{color:var(--muted);margin:0 0 20px;max-width:56ch}
.next{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:14px 16px;margin-bottom:20px}
.next b{font:800 1.15rem "Bricolage Grotesque",system-ui,sans-serif}
.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:12px;margin-bottom:16px}
.tabs button{flex:1;border:0;background:none;color:var(--ink);font:600 1rem "Source Sans 3",system-ui,sans-serif;padding:10px;border-radius:9px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.15)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
input[type=text],input[type=search]{flex:1 1 180px}
textarea{width:100%;resize:vertical}
.btn{border:0;background:var(--accent);color:var(--accent-ink);font:600 .95rem "Source Sans 3",system-ui,sans-serif;padding:10px 14px;border-radius:10px;cursor:pointer}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--accent)}
.btn.danger{background:none;color:var(--bad);border:1px solid var(--bad)}
.btn:disabled{opacity:.55;cursor:default}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.card h3{font-size:1.1rem;line-height:1.25}
.meta{color:var(--muted);font-size:.92rem;margin:4px 0}
.tag{display:inline-block;background:var(--soft);color:var(--accent);font-weight:600;font-size:.82rem;padding:2px 9px;border-radius:99px;margin:0 6px 6px 0}
details.card{padding:0}
summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
summary::-webkit-details-marker{display:none}
summary h3{grid-column:1}
.chip{font-weight:600;font-size:.88rem;white-space:nowrap}
.chip.warn{color:var(--warn)}.chip.bad{color:var(--bad)}.chip.ok{color:var(--ok)}
.bar{grid-column:1/-1;height:6px;background:var(--soft);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.body{padding:0 16px 16px;border-top:1px solid var(--line)}
.body label{display:block;font-weight:600;font-size:.9rem;margin:14px 0 4px}
.chk{display:flex;gap:10px;align-items:center;padding:6px 0}
.chk input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.chk span{flex:1}
.chk.done span{color:var(--muted);text-decoration:line-through}
.x{border:0;background:none;color:var(--muted);font-size:1.2rem;cursor:pointer;padding:2px 8px}
.empty{text-align:center;color:var(--muted);padding:32px 12px;border:1px dashed var(--line);border-radius:14px}
.note{color:var(--muted);font-size:.88rem;margin-top:20px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Scholarship tracker for undergrads</h1>
  <p class="lede">Find undergraduate scholarships around the world, track every deadline, and tick off each document until you hit submit.</p>
  <div id="next"></div>
  <div class="tabs" role="tablist">
    <button role="tab" id="t-find" aria-selected="true" data-tab="find">Find scholarships</button>
    <button role="tab" id="t-mine" aria-selected="false" data-tab="mine">My applications <span id="count"></span></button>
  </div>
  <section id="find">
    <div class="row">
      <input type="search" id="q" placeholder="Search by name, country or keyword" aria-label="Search scholarships">
      <select id="region" aria-label="Filter by region">
        <option value="">All regions</option><option>Europe</option><option>Asia</option><option>North America</option><option>Oceania</option><option>Global</option>
      </select>
    </div>
    <div class="row"><select id="aud" aria-label="Who can apply"><option value="">Any applicant</option><option value="intl">International applicants</option><option value="us">US students</option><option value="ca">Canadian and Israeli students</option><option value="admit">After admission to the university</option></select><label class="chk" style="padding:0"><input type="checkbox" id="full"><span>Full funding only</span></label></div>
    <div id="results"></div>
    <p class="note">Details and windows change every year. Always confirm eligibility and deadlines on the official scholarship website before you apply.</p>
  </section>
  <section id="mine" hidden>
    <form class="row" id="addForm" onsubmit="return false">
      <input type="text" id="cName" placeholder="Add your own scholarship" aria-label="Scholarship name">
      <input type="date" id="cDate" aria-label="Deadline">
      <button class="btn" id="cAdd" type="button">Add</button>
    </form>
    <div id="list"></div>
  </section>
</div>

<script>
var CATALOG=[
{n:"Türkiye Bursları",c:"Türkiye",r:"Europe",cov:"Full: tuition, housing, monthly stipend, flights, Turkish course",w:"Usually January to February",e:"International students applying for a first degree; strong grades"},
{n:"Global Korea Scholarship (Undergraduate)",c:"South Korea",r:"Asia",cov:"Full: tuition, allowance, flights, language training",w:"Usually February to March",e:"Non-Korean citizens; apply through an embassy or a partner university"},
{n:"MEXT Japanese Government Scholarship (Undergraduate)",c:"Japan",r:"Asia",cov:"Full: tuition, monthly allowance, flights, Japanese course",w:"Usually spring, through the Japanese embassy",e:"Applicants from eligible countries; exams and interview"},
{n:"Stipendium Hungaricum",c:"Hungary",r:"Europe",cov:"Tuition, housing support, monthly stipend, health insurance",w:"Usually mid-January",e:"Students from partner countries; apply via the Tempus portal"},
{n:"Chinese Government Scholarship (CSC)",c:"China",r:"Asia",cov:"Tuition, housing, living allowance, insurance",w:"Usually January to April",e:"International applicants; apply through your embassy or the university"},
{n:"Reach Oxford Scholarship",c:"United Kingdom",r:"Europe",cov:"Full course fees and living costs at Oxford",w:"Follows Oxford application deadlines (around October)",e:"Students from low-income countries who are admitted to Oxford"},
{n:"Lester B. Pearson International Scholarship",c:"Canada",r:"North America",cov:"Tuition, books, incidental fees, residence for four years",w:"Usually November to December",e:"Nominated by your school; University of Toronto"},
{n:"Davis UWC Scholars Program",c:"United States",r:"North America",cov:"Large grants at partner colleges",w:"Varies by partner college",e:"Graduates of United World Colleges"},
{n:"QuestBridge National College Match",c:"United States",r:"North America",cov:"Full four-year scholarships at partner colleges",w:"Usually late September",e:"High-achieving, low-income high school seniors"},
{n:"The Gates Scholarship",c:"United States",r:"North America",cov:"Full cost of attendance not covered by other aid",w:"Usually September",e:"Pell-eligible minority high school seniors who are US citizens"},
{n:"Mastercard Foundation Scholars Program",c:"Africa and partner countries",r:"Global",cov:"Tuition, living costs, mentoring, leadership programs",w:"Varies by partner university",e:"Academically talented students from Africa with financial need"},
{n:"Need-blind US colleges (Harvard, Yale, Princeton, MIT, Amherst)",c:"United States",r:"North America",cov:"Need-based grants that can cover most or all costs",w:"Early deadlines around November 1, regular around early January",e:"Admitted students with financial need, including international students"},
{n:"Berea College Tuition Promise Scholarship",c:"United States",r:"North America",cov:"Tuition covered for every admitted student",w:"Check Berea’s admissions calendar",e:"Low-income students, including international students"},
{n:"UBC International Scholars Program",c:"Canada",r:"North America",cov:"Partial to full financial support at UBC",w:"Usually around the December admission deadline",e:"International students with strong grades and leadership"},
{n:"Schulich Leader Scholarships",c:"Canada and Israel",r:"North America",cov:"Large awards for STEM undergraduates",w:"Usually nominated by your school in winter",e:"Graduating high school students entering STEM at partner universities"},
{n:"Jack Kent Cooke Foundation College Scholarship",c:"United States",r:"North America",cov:"Multi-year funding plus advising",w:"Usually opens in the fall",e:"High-achieving US high school seniors with financial need"},
{n:"Coca-Cola Scholars Program",c:"United States",r:"North America",cov:"Scholarship plus a national scholar community",w:"Usually August to October",e:"US high school seniors (citizens, nationals, permanent residents, refugees, asylees)"},
{n:"Hispanic Scholarship Fund",c:"United States",r:"North America",cov:"Scholarship plus a support network",w:"Usually winter to early spring",e:"Students of Hispanic heritage in the US, with GPA requirements"},
{n:"Global UGRAD Exchange",c:"United States",r:"North America",cov:"Fully funded exchange semester: tuition, housing, travel, stipend",w:"Varies by country, through local partners",e:"Undergraduates from selected countries with leadership and community involvement"},
{n:"Google Generation Scholarship",c:"Region-specific (Americas, EMEA, Asia Pacific)",r:"Global",cov:"Funding and a Google community for computing students",w:"Varies by region",e:"Undergraduates studying computer science or related fields"},
{n:"Holland Scholarship",c:"Netherlands",r:"Europe",cov:"One-time grant toward study costs",w:"Usually February 1 or May 1, depending on the university",e:"Non-EEA students admitted to Dutch universities"},
{n:"Government of Ireland International Education Scholarship",c:"Ireland",r:"Europe",cov:"Fee waiver and stipend for one academic year",w:"Usually March",e:"Non-EU/EEA students applying to Irish higher education institutions"},
{n:"Émile Boutmy Scholarship (Sciences Po)",c:"France",r:"Europe",cov:"Grants toward tuition",w:"Follows Sciences Po admission deadlines",e:"Non-EU undergraduate applicants"},
{n:"Deutschlandstipendium",c:"Germany",r:"Europe",cov:"€300 per month, half from private donors",w:"Set by each German university",e:"High-achieving students enrolled in Germany, including international students"},
{n:"Erasmus+ Student Mobility",c:"Europe",r:"Europe",cov:"Monthly grant for studying or interning abroad",w:"Set by your home university",e:"Students enrolled at participating universities"},
{n:"Jardine Foundation Scholarship",c:"United Kingdom",r:"Europe",cov:"Tuition, living costs and travel at Oxford or Cambridge",w:"Varies by country, usually autumn",e:"Undergraduates from selected Asian countries with an Oxford or Cambridge offer"},
{n:"Russian Government Scholarship",c:"Russia",r:"Europe",cov:"Tuition and monthly stipend",w:"Usually November to February",e:"Foreign students through embassy quotas"},
{n:"Melbourne International Undergraduate Scholarship",c:"Australia",r:"Oceania",cov:"Partial tuition reduction",w:"Follows the university’s admission rounds",e:"International students with outstanding academic results"},
{n:"Taiwan MOE Scholarship",c:"Taiwan",r:"Asia",cov:"Tuition support and monthly living allowance",w:"Usually February to March",e:"International students applying through Taiwan’s missions or a university"},
{n:"ICCR Scholarships",c:"India",r:"Asia",cov:"Tuition and living allowance",w:"Usually opens in spring",e:"Students from partner countries; apply through ICCR or Indian missions"},
{n:"NUS Undergraduate Scholarships",c:"Singapore",r:"Asia",cov:"Tuition and living support for selected awards",w:"Follows NUS admission deadlines",e:"International applicants admitted to NUS"},
{n:"JASSO Honors Scholarship",c:"Japan",r:"Asia",cov:"Monthly stipend for privately financed international students",w:"Applied for through your Japanese university after enrolling",e:"International students enrolled at Japanese universities"}
];
var DOCS=["Passport or national ID","Academic transcripts","Diploma or graduation certificate","Personal statement","Recommendation letters","Language test (IELTS, TOEFL or other)","Passport-size photo","Online application submitted"];
var AUD={us:["The Gates Scholarship","QuestBridge National College Match","Jack Kent Cooke Foundation College Scholarship","Coca-Cola Scholars Program","Hispanic Scholarship Fund"],ca:["Schulich Leader Scholarships"],admit:["Reach Oxford Scholarship","Need-blind US colleges (Harvard, Yale, Princeton, MIT, Amherst)","Berea College Tuition Promise Scholarship","UBC International Scholars Program","Holland Scholarship","Government of Ireland International Education Scholarship","Émile Boutmy Scholarship (Sciences Po)","Deutschlandstipendium","Erasmus+ Student Mobility","Jardine Foundation Scholarship","Melbourne International Undergraduate Scholarship","NUS Undergraduate Scholarships","JASSO Honors Scholarship"]};
var AUDL={intl:"International applicants",us:"US students",ca:"Canadian and Israeli students",admit:"After admission"};
var FULL=["Türkiye Bursları","Global Korea Scholarship (Undergraduate)","MEXT Japanese Government Scholarship (Undergraduate)","Stipendium Hungaricum","Chinese Government Scholarship (CSC)","Reach Oxford Scholarship","Lester B. Pearson International Scholarship","QuestBridge National College Match","The Gates Scholarship","Global UGRAD Exchange","Jardine Foundation Scholarship","Mastercard Foundation Scholars Program"];
function aud(s){for(var k in AUD)if(AUD[k].indexOf(s.n)>-1)return k;return"intl"}
var KEY="scholarship-tracker-v1",apps=[],openIds={};
try{var raw=localStorage.getItem(KEY);if(raw)apps=JSON.parse(raw)||[]}catch(e){apps=[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(apps))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function $(id){return document.getElementById(id)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function daysLeft(d){if(!d)return null;var p=d.split("-"),t=new Date(+p[0],+p[1]-1,+p[2]),n=new Date();n.setHours(0,0,0,0);return Math.round((t-n)/864e5)}
function chip(d,status){
  if(status==="Submitted"||status==="Result")return'<span class="chip ok">'+status+'</span>';
  var n=daysLeft(d);if(n===null)return'<span class="chip">No deadline</span>';
  if(n<0)return'<span class="chip bad">Overdue by '+(-n)+' d</span>';
  if(n===0)return'<span class="chip bad">Due today</span>';
  return'<span class="chip '+(n<=14?"warn":"")+'">'+n+' days left</span>';}
function progress(a){var t=a.docs.length;return t?Math.round(a.docs.filter(function(x){return x.done}).length/t*100):0}
function addApp(name,deadline,note){
  apps.push({id:uid(),name:name,deadline:deadline||"",status:"Planning",notes:note||"",docs:DOCS.map(function(t){return{t:t,done:false}})});
  save();render();}
function renderFind(){
  var q=$("q").value.toLowerCase(),r=$("region").value;
  var tracked={};apps.forEach(function(a){tracked[a.name]=1});
  var hits=CATALOG.filter(function(s){
    return(!r||s.r===r)&&(!$("aud").value||aud(s)===$("aud").value)&&(!$("full").checked||FULL.indexOf(s.n)>-1)&&(!q||(s.n+" "+s.c+" "+s.cov+" "+s.e).toLowerCase().indexOf(q)>-1)});
  $("results").innerHTML=hits.length?hits.map(function(s){
    var i=CATALOG.indexOf(s),t=tracked[s.n];
    return'<article class="card"><h3>'+esc(s.n)+'</h3><div class="meta"><span class="tag">'+esc(s.c)+'</span><span class="tag">'+esc(s.r)+'</span><span class="tag">'+AUDL[aud(s)]+'</span>'+(FULL.indexOf(s.n)>-1?'<span class="tag">Full funding</span>':'')+'</div>'+
    '<p class="meta"><b>Covers:</b> '+esc(s.cov)+'</p><p class="meta"><b>Who:</b> '+esc(s.e)+'</p><p class="meta"><b>Window:</b> '+esc(s.w)+'</p>'+
    '<button class="btn'+(t?' ghost':'')+'" data-add="'+i+'"'+(t?' disabled':'')+'>'+(t?'Tracking':'Track this scholarship')+'</button></article>'}).join("")
    :'<div class="empty">No match. Try a different word, or add your own scholarship under My applications.</div>';}
function renderMine(){
  $("count").textContent=apps.length?"("+apps.length+")":"";
  var sorted=apps.slice().sort(function(a,b){
    var x=a.deadline||"9999",y=b.deadline||"9999";return x<y?-1:x>y?1:0});
  $("list").innerHTML=sorted.length?sorted.map(function(a){
    var p=progress(a);
    return'<details class="card" data-id="'+a.id+'"'+(openIds[a.id]?' open':'')+'><summary><h3>'+esc(a.name)+'</h3>'+chip(a.deadline,a.status)+
    '<div class="bar" role="progressbar" aria-valuenow="'+p+'" aria-valuemin="0" aria-valuemax="100" aria-label="Documents ready"><i style="width:'+p+'%"></i></div></summary>'+
    '<div class="body"><div class="row" style="margin-top:14px"><div><label for="d'+a.id+'">Deadline</label><input type="date" id="d'+a.id+'" value="'+esc(a.deadline)+'" data-f="deadline" data-id="'+a.id+'"></div>'+
    '<div><label for="s'+a.id+'">Status</label><select id="s'+a.id+'" data-f="status" data-id="'+a.id+'">'+
    ["Planning","Preparing","Submitted","Result"].map(function(s){return'<option'+(s===a.status?' selected':'')+'>'+s+'</option>'}).join("")+'</select></div></div>'+
    '<label>Documents ('+p+'% ready)</label>'+
    a.docs.map(function(d,j){return'<div class="chk'+(d.done?' done':'')+'"><input type="checkbox" '+(d.done?'checked ':'')+'data-chk="'+j+'" data-id="'+a.id+'" aria-label="'+esc(d.t)+'"><span>'+esc(d.t)+'</span><button class="x" data-del="'+j+'" data-id="'+a.id+'" aria-label="Remove '+esc(d.t)+'">×</button></div>'}).join("")+
    '<div class="row" style="margin-top:8px"><input type="text" placeholder="Add a document or task" data-new="'+a.id+'" aria-label="New checklist item"><button class="btn ghost" data-addi="'+a.id+'">Add item</button></div>'+
    '<label for="n'+a.id+'">Notes</label><textarea rows="3" id="n'+a.id+'" data-f="notes" data-id="'+a.id+'" placeholder="Portal login hints, contacts, essay ideas">'+esc(a.notes)+'</textarea>'+
    '<div class="row" style="margin:12px 0 0"><button class="btn danger" data-rm="'+a.id+'">Stop tracking</button></div></div></details>'}).join("")
    :'<div class="empty">Nothing tracked yet. Pick a scholarship from Find scholarships, or add your own a
